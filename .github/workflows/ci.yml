name: PATH CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    name: Install, typecheck, and build web
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck workspace
        run: pnpm typecheck
      - name: Build web application
        env:
          NEON_AUTH_BASE_URL: https://ep-mute-fire-b2h30n59.neonauth.c-6.eu-central-1.aws.neon.tech/neondb/auth
          NEON_AUTH_COOKIE_SECRET: path-ci-only-not-for-deployment-0123456789abcdef
        run: pnpm --filter @path/web build
